<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分組討論工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft JhengHei', 'Noto Sans TC', 'PingFang TC', sans-serif;
            background: linear-gradient(135deg, #f8f1e9 0%, #d9c2a6 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        h2 {
            font-size: 3rem;
            font-weight: 700;
            color: #5D4037;
            margin-bottom: 2rem;
        }

        .grouping-container {
            display: flex;
            gap: 3rem;
            max-width: 1200px;
            width: 100%;
        }

        .input-section, .result-section {
            flex: 1;
            background: rgba(255,255,255,0.85);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.6);
            max-height: 70vh;
            overflow-y: auto;
        }

        .result-section { position: relative; }

        .input-section h3, .result-section h3 {
            font-size: 1.8rem;
            color: #8B4513;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .form-group { margin-bottom: 1.5rem; }

        .settings-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
        }

        .settings-row .form-group { margin-bottom: 1.5rem; }

        .form-group label {
            display: block;
            font-size: 1.1rem;
            color: #5D4037;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .form-group input[type="number"],
        .form-group input[type="text"] {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 2px solid #E8DAB2;
            background: rgba(255,255,255,0.95);
            color: #4A4A4A;
            font-size: 1rem;
            font-family: inherit;
        }

        .attendee-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .form-group .attendee-option {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.55rem 0.55rem;
            border: 2px solid #E8DAB2;
            border-radius: 12px;
            background: rgba(255,255,255,0.9);
            color: #5D4037;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            line-height: 1.2;
        }

        .form-group .attendee-option input {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            accent-color: #D2691E;
        }

        .form-group .attendee-option span {
            white-space: nowrap;
        }

        .add-member-row {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
        }

        .add-member-row input[type="text"] { flex: 1; }

        .btn-add {
            padding: 0 1.2rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #D2691E 0%, #CD853F 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            padding: 1.2rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            font-family: inherit;
        }

        .btn-primary { background: linear-gradient(135deg, #D2691E 0%, #CD853F 100%); color: white; }
        .btn-secondary { background: linear-gradient(135deg, #A8A8A8 0%, #8C8C8C 100%); color: white; }

        #groupResults {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
            align-content: start;
        }

        #groupResults > p { grid-column: 1 / -1; }

        .group-card {
            background: rgba(255,255,255,0.9);
            padding: 1.2rem;
            border-radius: 16px;
            border: 2px solid #E8DAB2;
        }

        .group-title {
            font-size: 1.15rem;
            color: #D2691E;
            font-weight: 700;
            margin-bottom: 0.6rem;
        }

        .group-members {
            font-size: 1rem;
            color: #6B4423;
            line-height: 1.6;
        }

        .discussion-timer {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: none;
            padding: 0.65rem 0.95rem;
            border: 2px solid #D2691E;
            border-radius: 14px;
            background: rgba(255, 248, 240, 0.96);
            color: #5D4037;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
            line-height: 1.2;
            box-shadow: 0 8px 20px rgba(93,64,55,0.14);
            transition: background 0.2s ease, transform 0.2s ease;
            z-index: 2;
        }

        .discussion-timer.visible {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .discussion-timer:hover {
            background: rgba(255, 238, 219, 0.98);
            transform: translateY(-1px);
        }

        .discussion-timer.finished {
            background: rgba(139, 69, 19, 0.16);
            border-color: #8B4513;
        }

        .member-name {
            display: inline-block;
            padding: 0.2rem 0.45rem;
            border-radius: 999px;
            transition: transform 0.08s ease, background 0.08s ease, color 0.08s ease;
        }

        .member-name.rolling {
            color: #D2691E;
            background: rgba(210, 105, 30, 0.12);
            animation: rollingSpeakerFlash 0.28s linear infinite;
        }

        .member-name.selected-speaker {
            color: white;
            background: linear-gradient(135deg, #D2691E 0%, #8B4513 100%);
            font-weight: 900;
            box-shadow: 0 8px 20px rgba(93,64,55,0.22);
        }

        .member-name.selected-speaker.pulsing {
            animation: selectedSpeakerPulse 1.1s ease-in-out infinite;
        }

        @keyframes rollingSpeakerFlash {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes selectedSpeakerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.22); }
        }

        @media (max-width: 1024px) {
            .grouping-container { flex-direction: column; gap: 1.5rem; }
            h2 { font-size: 2rem; }
        }

        @media (max-width: 520px) {
            .settings-row { grid-template-columns: 1fr; gap: 0; }
        }
    </style>
</head>
<body>

    <h2>分組討論</h2>
    <div class="grouping-container">
        <div class="input-section">
            <h3>📝 參與成員</h3>
            <div class="form-group">
                <div class="attendee-list" id="attendeeList"></div>
                <div class="add-member-row">
                    <input type="text" id="newMemberName" placeholder="新增成員名稱" onkeydown="if(event.key==='Enter') addMember()"/>
                    <button class="btn-add" type="button" onclick="addMember()">➕ 新增</button>
                </div>
            </div>
            <div class="settings-row">
                <div class="form-group">
                    <label for="groups"> 分幾組：</label>
                    <input type="number" id="groups" min="1" max="20" value="3"/>
                </div>
                <div class="form-group">
                    <label for="discussionMinutes"> 討論時間（分鐘）：</label>
                    <input type="number" id="discussionMinutes" min="1" max="120" value="10"/>
                </div>
            </div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="randomizeGroups()">🎯 開始分組</button>
                <button class="btn btn-secondary" onclick="clearAll()">🗑️ 清空</button>
            </div>
        </div>
        <div class="result-section">
            <h3>✅ 分組結果</h3>
            <button class="discussion-timer" id="discussionTimer" type="button" onclick="resetDiscussionTimer(false)">開始討論：10:00</button>
            <div id="groupResults">
                <p style="color: #A8A8A8; text-align: center;">勾選出席者並點擊「開始分組」</p>
            </div>
        </div>
    </div>

    <script>
        // ── 可自訂：修改此清單以更換團隊成員 ──────────────────────────
        const defaultNames = [
            'Annie',
            'Bill',
            'Carey',
            'Denny',
            'Eric',
            'Flora',
            'Gary',
            'Honda',
            'Iris',
            'Jerry',
            'Kate',
            'Lio'
        ];
        // ─────────────────────────────────────────────────────────────────

        const discussionStartDelayMs = 10 * 1000;
        // 動態新增的成員
        let extraNames = [];
        let discussionRemainingSeconds = getDiscussionDurationSeconds();
        let discussionTimerInterval = null;
        let discussionStartDelayTimer = null;
        let speakerAnimationTimers = [];
        let speakerStopTimers = [];

        function escapeHtml(value) {
            return value
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderAttendeeList() {
            const attendeeList = document.getElementById('attendeeList');
            attendeeList.innerHTML = [...defaultNames, ...extraNames].map(name => `
                <label class="attendee-option">
                    <input type="checkbox" value="${escapeHtml(name)}" checked>
                    <span>${escapeHtml(name)}</span>
                </label>
            `).join('');
        }

        function addMember() {
            const input = document.getElementById('newMemberName');
            const name = input.value.trim();
            if (!name) return;

            const existing = [...defaultNames, ...extraNames].some(item => item.toLowerCase() === name.toLowerCase());
            if (existing) {
                alert(`「${name}」已在名單中`);
                return;
            }

            // 保留目前勾選狀態再重繪
            const checkedNames = new Set(
                Array.from(document.querySelectorAll('#attendeeList input:checked')).map(item => item.value)
            );
            checkedNames.add(name);
            extraNames.push(name);
            renderAttendeeList();
            document.querySelectorAll('#attendeeList input[type="checkbox"]').forEach(item => {
                item.checked = checkedNames.has(item.value);
            });

            input.value = '';
            input.focus();
        }

        function getDiscussionDurationSeconds() {
            const minutes = parseInt(document.getElementById('discussionMinutes')?.value, 10);
            return (Number.isFinite(minutes) && minutes > 0 ? minutes : 10) * 60;
        }

        function formatDiscussionTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const paddedSeconds = String(seconds % 60).padStart(2, '0');
            return `${minutes}:${paddedSeconds}`;
        }

        function updateDiscussionTimerDisplay() {
            const timerButton = document.getElementById('discussionTimer');
            if (!timerButton) return;
            timerButton.textContent = `開始討論：${formatDiscussionTime(discussionRemainingSeconds)}`;
            timerButton.classList.toggle('finished', discussionRemainingSeconds === 0);
        }

        function showDiscussionTimer() {
            document.getElementById('discussionTimer')?.classList.add('visible');
        }

        function hideDiscussionTimer() {
            document.getElementById('discussionTimer')?.classList.remove('visible', 'finished');
        }

        function stopDiscussionTimer() {
            clearInterval(discussionTimerInterval);
            clearTimeout(discussionStartDelayTimer);
            discussionTimerInterval = null;
            discussionStartDelayTimer = null;
        }

        function startDiscussionTimer() {
            stopDiscussionTimer();
            updateDiscussionTimerDisplay();
            discussionTimerInterval = setInterval(() => {
                discussionRemainingSeconds = Math.max(0, discussionRemainingSeconds - 1);
                updateDiscussionTimerDisplay();
                if (discussionRemainingSeconds === 0) stopDiscussionTimer();
            }, 1000);
        }

        function resetDiscussionTimer(useDelay = true) {
            showDiscussionTimer();
            stopDiscussionTimer();
            discussionRemainingSeconds = getDiscussionDurationSeconds();
            updateDiscussionTimerDisplay();
            if (useDelay) {
                discussionStartDelayTimer = setTimeout(startDiscussionTimer, discussionStartDelayMs);
                return;
            }
            startDiscussionTimer();
        }

        function clearSpeakerAnimationTimers() {
            speakerAnimationTimers.forEach(timer => clearInterval(timer));
            speakerStopTimers.forEach(timer => clearTimeout(timer));
            speakerAnimationTimers = [];
            speakerStopTimers = [];
        }

        function pickSpeaker(group, index) {
            const memberNodes = Array.from(document.querySelectorAll(`[data-group-index="${index}"] .member-name`));
            const finalSpeakerIndex = Math.floor(Math.random() * group.length);
            let tick = 0;

            const highlightMember = memberIndex => {
                memberNodes.forEach(node => node.classList.remove('rolling'));
                memberNodes[memberIndex].classList.add('rolling');
            };

            highlightMember(0);
            const timer = setInterval(() => {
                highlightMember(tick % group.length);
                tick++;
            }, 90);
            speakerAnimationTimers.push(timer);

            const stopTimer = setTimeout(() => {
                clearInterval(timer);
                speakerAnimationTimers = speakerAnimationTimers.filter(item => item !== timer);
                speakerStopTimers = speakerStopTimers.filter(item => item !== stopTimer);
                memberNodes.forEach(node => node.classList.remove('rolling'));
                memberNodes[finalSpeakerIndex].classList.add('selected-speaker', 'pulsing');

                const pulseStopTimer = setTimeout(() => {
                    memberNodes[finalSpeakerIndex].classList.remove('pulsing');
                    speakerStopTimers = speakerStopTimers.filter(item => item !== pulseStopTimer);
                }, 20000);
                speakerStopTimers.push(pulseStopTimer);
            }, 1400 + index * 450);
            speakerStopTimers.push(stopTimer);
        }

        function randomizeGroups() {
            clearSpeakerAnimationTimers();

            const groupCount = parseInt(document.getElementById('groups').value);
            const names = Array.from(document.querySelectorAll('#attendeeList input:checked'))
                .map(input => input.value.trim())
                .filter(name => name);

            if (!names.length || groupCount < 1) {
                alert('請至少勾選一位出席者並設定組數');
                return;
            }

            if (names.length < groupCount) {
                alert(`人數 (${names.length}) 少於組數 (${groupCount})`);
                return;
            }

            const shuffled = [...names];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            const groups = Array.from({ length: groupCount }, () => []);
            shuffled.forEach((name, index) => {
                groups[index % groupCount].push(name);
            });

            resetDiscussionTimer();

            const resultDiv = document.getElementById('groupResults');
            resultDiv.innerHTML = '';

            groups.forEach((group, index) => {
                const groupCard = document.createElement('div');
                groupCard.className = 'group-card';
                groupCard.innerHTML = `
                    <div class="group-title">第 ${index + 1} 組 (${group.length}人)</div>
                    <div class="group-members" data-group-index="${index}">${group.map(name => `<span class="member-name">${escapeHtml(name)}</span>`).join(' • ')}</div>
                `;
                resultDiv.appendChild(groupCard);
                pickSpeaker(group, index);
            });
        }

        function clearAll() {
            clearSpeakerAnimationTimers();
            stopDiscussionTimer();
            document.getElementById('discussionMinutes').value = '10';
            discussionRemainingSeconds = getDiscussionDurationSeconds();
            updateDiscussionTimerDisplay();
            hideDiscussionTimer();
            document.querySelectorAll('#attendeeList input[type="checkbox"]').forEach(input => {
                input.checked = true;
            });
            document.getElementById('groups').value = '3';
            document.getElementById('groupResults').innerHTML = '<p style="color: #A8A8A8; text-align: center;">勾選出席者並點擊「開始分組」</p>';
        }

        updateDiscussionTimerDisplay();
        hideDiscussionTimer();
        renderAttendeeList();
    </script>
</body>
</html>
